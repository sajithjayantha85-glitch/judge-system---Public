<!DOCTYPE html>
<html lang="en" class="bg-slate-100 text-slate-900">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Judge QR Cards | Printable Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
      .page-break { page-break-after: always; }
      .card-item { break-inside: avoid; border: 1px dashed #cbd5e1 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="p-6">

  <!-- No-Print Control Header -->
  <div class="no-print max-w-5xl mx-auto mb-8 bg-slate-900 text-white p-6 rounded-3xl shadow-xl flex flex-wrap items-center justify-between gap-4">
    <div>
      <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-amber-400 text-xs font-bold mb-2">
        <i class="fa-solid fa-building-columns"></i>
        <span>Department of Examinations, Sri Lanka</span>
      </div>
      <h1 class="text-xl font-bold flex items-center space-x-2">
        <i class="fa-solid fa-print text-amber-400"></i>
        <span>Printable Judge QR Cards (20 Judges)</span>
      </h1>
      <p class="text-xs text-slate-400 mt-1">
        Print these cards on A4 paper and place them on each judge's desk. Judges scan with their smartphone camera for instant login.
      </p>
    </div>

    <div class="flex items-center space-x-3">
      <button onclick="window.print()" class="px-5 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl text-sm flex items-center space-x-2 shadow-lg shadow-amber-500/30 transition-all">
        <i class="fa-solid fa-print"></i>
        <span>Print A4 Sheet</span>
      </button>
      <a href="/" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-sm border border-slate-700 transition-colors flex items-center space-x-1.5">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
      </a>
      <a href="/admin.html" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-sm border border-slate-700 transition-colors">
        Admin Panel
      </a>
    </div>
  </div>

  <!-- Cards Grid (Print Friendly A4 2x3 or 2x2) -->
  <div id="cardsGrid" class="max-w-5xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-2 lg:grid-cols-2 gap-6">
    <!-- 20 Cards generated via JS -->
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/state');
        const state = await res.json();
        renderCards(state.judges || []);
      } catch (err) {
        console.error('Error loading judges:', err);
      }
    });

    function renderCards(judges) {
      const container = document.getElementById('cardsGrid');
      container.innerHTML = '';

      const origin = window.location.origin;

      judges.forEach(j => {
        const pin = (1000 + j.id).toString();
        const loginUrl = `${origin}/judge.html?judge=${j.id}&pin=${pin}`;

        const card = document.createElement('div');
        card.className = 'card-item bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col justify-between relative overflow-hidden';

        const qrId = `qr-${j.id}`;

        card.innerHTML = `
          <!-- Top Accent Bar -->
          <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-amber-600 bg-amber-50 px-2 py-0.5 rounded">Department of Examinations, Sri Lanka</span>
              <h2 class="text-2xl font-black text-slate-900 mt-1">${j.name}</h2>
            </div>
            <div class="text-right">
              <span class="text-xs text-slate-400 block font-medium">Security PIN</span>
              <span class="text-xl font-mono font-bold text-slate-800 tracking-wider bg-slate-100 px-2.5 py-0.5 rounded-lg border border-slate-200">${pin}</span>
            </div>
          </div>

          <!-- Content: QR & Instructions -->
          <div class="flex items-center space-x-5 my-2">
            <div id="${qrId}" class="p-2 bg-white border border-slate-200 rounded-xl flex-shrink-0 shadow-inner"></div>
            <div class="text-xs text-slate-600 space-y-2">
              <p class="font-bold text-slate-800 flex items-center">
                <i class="fa-solid fa-camera mr-1.5 text-amber-500"></i> Scan with Phone Camera
              </p>
              <p class="text-[11px] leading-relaxed text-slate-500">
                Scan this QR code with your smartphone camera to access your official scoring interface instantly.
              </p>
              <div class="text-[10px] font-mono text-slate-400 truncate max-w-[200px]">
                ${loginUrl}
              </div>
            </div>
          </div>

          <!-- Bottom Footer -->
          <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-[10px] text-slate-400">
            <span>Department of Examinations, Sri Lanka</span>
            <span class="font-semibold text-slate-600">Scoring Scale: 1 – 10</span>
          </div>
        `;

        container.appendChild(card);

        // Generate QR code
        new QRCode(document.getElementById(qrId), {
          text: loginUrl,
          width: 110,
          height: 110,
          colorDark: '#0f172a',
          colorLight: '#ffffff',
          correctLevel: QRCode.CorrectLevel.M
        });
      });
    }
  </script>
</body>
</html>
