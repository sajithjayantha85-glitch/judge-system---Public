<!DOCTYPE html>
<html lang="si" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Judge Portal | විනිශ්චයකාර පිවිසුම</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: 'Inter', 'Noto Sans Sinhala', sans-serif; -webkit-tap-highlight-color: transparent; }
    .score-btn.selected {
      transform: scale(1.08);
      ring-width: 3px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between select-none">

  <!-- ================= AUTH SCREEN ================= -->
  <div id="authScreen" class="fixed inset-0 z-50 bg-slate-950 flex flex-col justify-center items-center px-6">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-2xl">
      <div class="text-center mb-6">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-500 to-red-600 flex items-center justify-center text-white text-3xl mx-auto shadow-lg shadow-amber-500/20 mb-3">
          <i class="fa-solid fa-gavel"></i>
        </div>
        <h2 class="text-2xl font-bold text-white">විනිශ්චයකාර පිවිසුම</h2>
        <p class="text-xs text-slate-400 mt-1">Judge Authentication Portal</p>
      </div>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">විනිශ්චයකාර අංකය (Judge #)</label>
          <select id="judgeSelect" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-base font-semibold focus:outline-none focus:border-amber-500">
            <option value="">-- තෝරන්න (Select Judge) --</option>
            <!-- Generated 1 to 20 -->
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">රහස් අංකය (PIN)</label>
          <input type="password" id="pinInput" placeholder="PIN අංකය ඇතුළත් කරන්න" maxlength="6" inputmode="numeric" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white text-center tracking-widest text-lg font-bold focus:outline-none focus:border-amber-500 placeholder:text-slate-500 placeholder:text-xs placeholder:tracking-normal">
        </div>

        <div id="loginError" class="hidden text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-xl text-center"></div>

        <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 active:scale-[0.98] text-white font-bold rounded-xl shadow-lg shadow-amber-500/25 transition-all">
          ඇතුල් වන්න (Log In)
        </button>
      </form>
    </div>
  </div>

  <!-- ================= MAIN JUDGE INTERFACE ================= -->
  <div id="mainApp" class="flex-1 flex flex-col">

    <!-- Top Sticky Header -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
      <div class="flex items-center justify-between">
        <!-- Judge Info -->
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 font-bold text-xs">
            <i class="fa-solid fa-user-check"></i>
          </div>
          <div>
            <div class="text-sm font-bold text-white" id="headerJudgeName">Judge --</div>
            <div class="text-[10px] text-emerald-400 flex items-center">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 animate-pulse"></span> Connected
            </div>
          </div>
        </div>

        <!-- Competition Badge -->
        <div class="text-right">
          <span id="headerCompBadge" class="inline-block text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-400 border border-amber-500/30">
            කොඩි තරඟය (Flags)
          </span>
        </div>
      </div>

      <!-- Voting Lock Banner -->
      <div id="lockBanner" class="hidden mt-2 py-1.5 px-3 bg-red-500/20 border border-red-500/40 rounded-lg text-center text-xs font-bold text-red-400 animate-pulse">
        <i class="fa-solid fa-lock mr-1.5"></i> ලකුණු ලබාදීම අත්හිටුවා ඇත (Voting Locked)
      </div>
    </header>

    <!-- Content Area -->
    <main class="flex-1 px-4 py-4 max-w-md mx-auto w-full flex flex-col space-y-4">

      <!-- Item Horizontal Nav / Progress -->
      <div>
        <div class="flex justify-between items-center text-xs text-slate-400 mb-1.5">
          <span>නිර්මාණ ලැයිස්තුව (All Designs)</span>
          <span id="scoringProgress" class="font-bold text-amber-400">0 / 0 Scored</span>
        </div>
        <div id="itemNavList" class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
          <!-- Item Chips -->
        </div>
      </div>

      <!-- Active Item Card -->
      <div class="bg-slate-900 border border-slate-800 rounded-3xl p-4 shadow-xl flex flex-col">
        <!-- Title & Badge -->
        <div class="flex items-center justify-between mb-3">
          <div>
            <span id="activeItemBadge" class="text-xs font-bold text-amber-400 bg-amber-500/10 border border-amber-500/20 px-2 py-0.5 rounded-md uppercase tracking-wider">
              No. 01
            </span>
            <h3 id="activeItemTitle" class="text-xl font-extrabold text-white mt-1">Flag #01</h3>
          </div>
          <div id="alreadyScoredTag" class="hidden px-2.5 py-1 rounded-full bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 text-xs font-bold flex items-center">
            <i class="fa-solid fa-circle-check mr-1.5"></i> <span id="currentScoreValue">--</span> / 10
          </div>
        </div>

        <!-- Image Container -->
        <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 mb-3 group cursor-pointer" onclick="openImageModal()">
          <img id="activeItemImage" src="" alt="Design Preview" class="w-full h-full object-contain">
          <div class="absolute bottom-2 right-2 bg-slate-900/80 px-2 py-1 rounded-lg text-[10px] text-slate-300 backdrop-blur">
            <i class="fa-solid fa-expand mr-1"></i> ලොකු කර බලන්න
          </div>
        </div>

        <p id="activeItemDesc" class="text-xs text-slate-400 mb-4"></p>

        <!-- 1 to 10 Scale Selector -->
        <div>
          <label class="block text-xs font-bold text-slate-300 mb-2">
            ලකුණු ලබාදෙන්න (Score: 1 - 10)
          </label>
          
          <!-- 10 Scale Grid Buttons -->
          <div class="grid grid-cols-5 gap-2" id="scoreGrid">
            <!-- 1 to 5 Row -->
            <button type="button" onclick="selectScore(1)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="1">1</button>
            <button type="button" onclick="selectScore(2)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="2">2</button>
            <button type="button" onclick="selectScore(3)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="3">3</button>
            <button type="button" onclick="selectScore(4)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="4">4</button>
            <button type="button" onclick="selectScore(5)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="5">5</button>
            <!-- 6 to 10 Row -->
            <button type="button" onclick="selectScore(6)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="6">6</button>
            <button type="button" onclick="selectScore(7)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="7">7</button>
            <button type="button" onclick="selectScore(8)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="8">8</button>
            <button type="button" onclick="selectScore(9)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="9">9</button>
            <button type="button" onclick="selectScore(10)" class="score-btn h-12 rounded-xl font-extrabold text-lg transition-all bg-slate-800 text-slate-200 hover:bg-slate-700 border border-slate-700 active:scale-95" data-val="10">10</button>
          </div>
        </div>

        <!-- Optional Comments -->
        <div class="mt-4">
          <input type="text" id="scoreComment" placeholder="කෙටි අදහස් දැක්වීමක් (Optional Remarks)" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-amber-500">
        </div>

        <!-- Submit Button -->
        <button id="submitBtn" onclick="submitCurrentScore()" class="mt-4 w-full py-4 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 active:from-amber-600 active:to-amber-700 text-white font-extrabold text-base shadow-lg shadow-amber-500/25 flex items-center justify-center space-x-2 transition-all active:scale-[0.98]">
          <i class="fa-solid fa-check"></i>
          <span>ලකුණු සටහන් කරන්න (Submit Score)</span>
        </button>
      </div>

    </main>
  </div>

  <!-- Image Modal for Fullscreen Preview -->
  <div id="imageModal" class="fixed inset-0 z-50 bg-black/95 hidden flex flex-col justify-center items-center p-4">
    <button onclick="closeImageModal()" class="absolute top-4 right-4 text-white text-2xl w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="modalImage" src="" class="max-w-full max-h-[85vh] object-contain rounded-xl">
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 border border-emerald-500 text-emerald-400 px-5 py-3 rounded-2xl shadow-2xl text-xs font-bold hidden flex items-center space-x-2">
    <i class="fa-solid fa-circle-check text-base"></i>
    <span id="toastMsg">ලකුණු සාර්ථකව සටහන් විය!</span>
  </div>

  <script src="/js/judge.js"></script>
</body>
</html>
